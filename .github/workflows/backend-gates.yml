name: Backend Gates

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 2,5'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Dependency integrity
        run: python -m pip check

      - name: Compile
        run: python -m compileall -q bot.py render_free.py tests

      - name: Shell syntax
        run: |
          bash -n termux_setup.sh
          bash -n termux_start.sh
          bash -n termux_supervisor.sh

      - name: Unit tests
        run: python -m unittest discover -s tests -v
